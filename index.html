<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Adnin</title>
</head>

<body>
    <div class="container">
        <div class="Mainprompt">
            <img class="image" src="images/catflower.jpg"></img>
            <p id="spotify-text" class="spotify-text">
                Scan this to listen to the song I picked just for you. ❤️
            </p>
            <img id="spotify-code" class="spotify-code" src="images/spotify-code.png" alt="Spotify Code">
            <h1 class="hh" id="name">Hey beautiful!</h1>
            <p class="pp" id="question">I want to show you this!</p>
            <div class="buttons">
                <button id="no-button" onclick="showMessage('No')">No</button>
                <button onclick="showMessage('Yes')" id="yesButton">Yes</button>
            </div>
            <div class="hidden-message" id="no-message">
                <p>Nice try, but you can't escape that easily!</p>
            </div>
            <div class="hidden-message" id="yes-message">
                <p>I made this for you, Princess.</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
